<g class="fade" style="animation-delay: 0.10s"><text x="20" y="72" class="value">2,531</text><text x="20" y="90" class="label">Threads</text></g>
<g class="fade" style="animation-delay: 0.18s"><text x="138" y="72" class="value">8,449</text><text x="138" y="90" class="label">Agent runs</text></g>
<g class="fade" style="animation-delay: 0.26s"><text x="256" y="72" class="value">42</text><text x="256" y="90" class="label">Peak parallel runs</text></g>
<g class="fade" style="animation-delay: 0.34s"><text x="374" y="72" class="value">1,823</text><text x="374" y="90" class="label">Subagents</text></g>
<g class="fade" style="animation-delay: 0.42s"><text x="20" y="130" class="value">593</text><text x="20" y="148" class="label">PRs merged</text></g>
<g class="fade" style="animation-delay: 0.50s"><text x="138" y="130" class="value">+1.5M</text><text x="138" y="148" class="label">Lines merged</text></g>
<g class="fade" style="animation-delay: 0.58s"><text x="256" y="130" class="value">6 min</text><text x="256" y="148" class="label">Median PR to merge</text></g>
<g class="fade" style="animation-delay: 0.66s"><text x="374" y="130" class="value">93.6%</text><text x="374" y="148" class="label">Runs completed</text></g>
</svg>
