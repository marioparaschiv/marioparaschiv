<svg xmlns="http://www.w3.org/2000/svg" width="495" height="166" viewBox="0 0 495 166" fill="none" role="img" aria-label="Agent activity">
<title>Agent activity</title>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #1f2328; }
  .muted { fill: #59636e; }
  .accent { fill: #2f6fb0; }
  .label { font-size: 12px; fill: #59636e; }
  .value { font-size: 22px; font-weight: 600; }
  .heading { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: #59636e; }
  .fade { opacity: 0; animation: fade 0.6s ease-out forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
<text x="20" y="28" class="heading">AGENT ACTIVITY</text>
<text x="475" y="28" class="label" text-anchor="end">since Oct 2026 · 38 days</text>
<rect x="20" y="38" width="0" height="2" rx="1" fill="#2f6fb0"><animate attributeName="width" from="0" to="455" dur="0.9s" fill="freeze"/></rect>
<g class="fade" style="animation-delay: 0.10s"><text x="20" y="72" class="value">33.1B</text><text x="20" y="90" class="label">Tokens processed</text></g>
<g class="fade" style="animation-delay: 0.18s"><text x="138" y="72" class="value">3,163</text><text x="138" y="90" class="label">Sessions</text></g>
<g class="fade" style="animation-delay: 0.26s"><text x="256" y="72" class="value">229k</text><text x="256" y="90" class="label">Tool calls</text></g>
<g class="fade" style="animation-delay: 0.34s"><text x="374" y="72" class="value">918</text><text x="374" y="90" class="label">Agent hours</text></g>
<g class="fade" style="animation-delay: 0.42s"><text x="20" y="130" class="value">5,004</text><text x="20" y="148" class="label">Commits</text></g>
<g class="fade" style="animation-delay: 0.50s"><text x="138" y="130" class="value">807</text><text x="138" y="148" class="label">PRs opened</text></g>
<g class="fade" style="animation-delay: 0.58s"><text x="256" y="130" class="value">1,022</text><text x="256" y="148" class="label">Subagents</text></g>
<g class="fade" style="animation-delay: 0.66s"><text x="374" y="130" class="value">120M</text><text x="374" y="148" class="label">Tokens written</text></g>
</svg>
