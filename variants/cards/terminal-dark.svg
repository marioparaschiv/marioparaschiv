<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180" fill="none" role="img" aria-label="Agent terminal">
<title>Agent terminal</title>
<style>
  text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #e6edf3; }
  .muted { fill: #8b949e; }
  .accent { fill: #4F8CC9; }
  .label { font-size: 12px; fill: #8b949e; }
  .value { font-size: 22px; font-weight: 600; }
  .heading { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: #8b949e; }
  .fade { opacity: 0; animation: fade 0.6s ease-out forwards; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  #l0 { animation: type0 0.9s steps(30, end) 0.0s forwards; }
@keyframes type0 { from { width: 0; } to { width: 252px; } }
#l1 { animation: type1 0.9s steps(47, end) 1.1s forwards; }
@keyframes type1 { from { width: 0; } to { width: 388px; } }
#l2 { animation: type2 0.9s steps(48, end) 2.2s forwards; }
@keyframes type2 { from { width: 0; } to { width: 396px; } }
#l3 { animation: type3 0.9s steps(10, end) 3.3s forwards; }
@keyframes type3 { from { width: 0; } to { width: 92px; } }
#l4 { animation: type4 0.9s steps(54, end) 4.4s forwards; }
@keyframes type4 { from { width: 0; } to { width: 444px; } }
.cursor { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #l0, #l1, #l2, #l3, #l4 { width: 495px; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
<circle cx="24" cy="24" r="5" fill="#ff5f57"/><circle cx="40" cy="24" r="5" fill="#febc2e"/><circle cx="56" cy="24" r="5" fill="#28c840"/>
<text x="247.5" y="28" class="label" text-anchor="middle">mario@vps: ~</text>
<rect x="0.5" y="0.5" width="494" height="179" rx="10" stroke="#30363d"/>
<clipPath id="c0"><rect id="l0" x="18" y="48" width="0" height="20"/></clipPath>
<text x="20" y="62" font-size="12.5" clip-path="url(#c0)" class="accent" style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ agent stats --since oct-2026</text>
<clipPath id="c1"><rect id="l1" x="18" y="70" width="0" height="20"/></clipPath>
<text x="20" y="84" font-size="12.5" clip-path="url(#c1)"  style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3,154 sessions · 227k tool calls · 32.9B tokens</text>
<clipPath id="c2"><rect id="l2" x="18" y="92" width="0" height="20"/></clipPath>
<text x="20" y="106" font-size="12.5" clip-path="url(#c2)"  style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">590 PRs merged · +1.5M lines · 42 agents at once</text>
<clipPath id="c3"><rect id="l3" x="18" y="114" width="0" height="20"/></clipPath>
<text x="20" y="128" font-size="12.5" clip-path="url(#c3)" class="accent" style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ gh reach</text>
<clipPath id="c4"><rect id="l4" x="18" y="136" width="0" height="20"/></clipPath>
<text x="20" y="150" font-size="12.5" clip-path="url(#c4)"  style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">73.4k downloads · 1,875 stars · 18 PRs merged upstream</text>
<rect class="cursor" x="20" y="160" width="8" height="14" fill="#4F8CC9"/>
</svg>
